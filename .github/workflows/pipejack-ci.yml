name: PipeJack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Verify Go Code Formatting
        run: |
          diffs=$(gofmt -l core/pipejack services/custom-ci)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files detected:"
            echo "$diffs"
            exit 1
          fi

      - name: Test Core Security Engine (core/pipejack)
        run: |
          cd core/pipejack
          go test -v -count=1 ./...
          go test -race ./...
          go vet ./...
          go build -v -o /dev/null ./cmd/pipejackd
          go build -v -o /dev/null ./cmd/proctree

      - name: Test CI Orchestrator (services/custom-ci)
        run: |
          cd services/custom-ci
          go test -v -count=1 ./...
          go vet ./...
          go build -v -o /dev/null .

      - name: Verify Secret & Credential Hygiene
        run: |
          echo "Scanning repository for accidentally committed private keys or secrets..."
          # Check for unencrypted private keys and tokens
          if grep -r --exclude-dir=".git" -E "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----" . ; then
            echo "ERROR: Private key pattern found in repository!"
            exit 1
          fi
          if grep -r --exclude-dir=".git" --exclude="*.md" -E "(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})" . ; then
            echo "ERROR: GitHub Personal Access Token found in repository!"
            exit 1
          fi
          if grep -r --exclude-dir=".git" --exclude="*.md" -E "AKIA[0-9A-Z]{16}" . ; then
            echo "ERROR: AWS Access Key ID found in repository!"
            exit 1
          fi
          echo "Secret hygiene scan passed cleanly: Zero credentials detected."
