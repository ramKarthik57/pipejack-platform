    <rect width="280" height="38" rx="12" fill="#312e81"/>
    <rect y="26" width="280" height="12" fill="#312e81"/>
    <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">ATTESTATION RECORD N-1</text>

    <text x="16" y="58" font-size="10" font-weight="700" fill="#94a3b8">TIMESTAMP:</text>
    <text x="95" y="58" font-size="10" font-family="monospace" fill="#e0e7ff">1791221321</text>

    <text x="16" y="78" font-size="10" font-weight="700" fill="#94a3b8">VERDICT:</text>
    <text x="95" y="78" font-size="10" font-weight="700" fill="#34d399">ALLOW (HTTP 200)</text>

    <text x="16" y="98" font-size="10" font-weight="700" fill="#94a3b8">PREV HASH:</text>
    <text x="16" y="114" font-size="9" font-family="monospace" fill="#a5b4fc">e4b78a9c1d02...33f9</text>

    <rect x="12" y="130" width="256" height="58" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="146" font-size="9.5" font-weight="700" fill="#38bdf8">CANONICAL PAYLOAD HASH</text>
    <text x="20" y="162" font-size="8.5" font-family="monospace" fill="#94a3b8">SHA256(metadata + sensors + verdict)</text>
    <text x="20" y="178" font-size="9" font-family="monospace" fill="#38bdf8">self_hash: 7a8f90bc12...8e41</text>

    <rect x="12" y="200" width="256" height="52" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="2 2"/>
    <text x="20" y="218" font-size="9.5" font-weight="700" fill="#a5b4fc">ED25519 ASYMMETRIC SIGNATURE</text>
    <text x="20" y="238" font-size="8" font-family="monospace" fill="#c7d2fe">sig: 9f03c411...89a2bc1d (Verified)</text>
  </g>

  <!-- Hash Link N-1 to N -->
