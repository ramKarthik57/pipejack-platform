    <text x="95" y="78" font-size="10" font-weight="700" fill="#ef4444">BLOCK (Quarantine)</text>

    <text x="16" y="98" font-size="10" font-weight="700" fill="#38bdf8">PREV HASH = Record N-1 self_hash:</text>
    <text x="16" y="114" font-size="9" font-family="monospace" fill="#38bdf8">7a8f90bc12...8e41</text>

    <rect x="12" y="130" width="256" height="58" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="20" y="146" font-size="9.5" font-weight="700" fill="#38bdf8">CANONICAL PAYLOAD HASH</text>
    <text x="20" y="162" font-size="8.5" font-family="monospace" fill="#94a3b8">SHA256(metadata + violations + verdict)</text>
    <text x="20" y="178" font-size="9" font-family="monospace" fill="#38bdf8">self_hash: 2c51ea409d...331a</text>

    <rect x="12" y="200" width="256" height="52" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="2 2"/>
    <text x="20" y="218" font-size="9.5" font-weight="700" fill="#a5b4fc">ED25519 ASYMMETRIC SIGNATURE</text>
    <text x="20" y="238" font-size="8" font-family="monospace" fill="#c7d2fe">sig: 4a2177f8...ec99015b (Verified)</text>
  </g>

  <!-- Hash Link N to N+1 -->
  <path d="M 690 230 L 760 230" stroke="#818cf8" stroke-width="2.5" marker-end="url(#chainArrow)"/>
  <rect x="698" y="200" width="56" height="20" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="726" y="213" text-anchor="middle" font-size="8.5" font-weight="700" fill="#818cf8">LINK</text>

