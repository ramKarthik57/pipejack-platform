    <text x="16" y="114" font-size="9" font-family="monospace" fill="#38bdf8">2c51ea409d...331a</text>

    <rect x="12" y="130" width="256" height="58" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="146" font-size="9.5" font-weight="700" fill="#38bdf8">CANONICAL PAYLOAD HASH</text>
    <text x="20" y="162" font-size="8.5" font-family="monospace" fill="#94a3b8">SHA256(metadata + sensors + verdict)</text>
    <text x="20" y="178" font-size="9" font-family="monospace" fill="#38bdf8">self_hash: d81a073f91...aa29</text>

    <rect x="12" y="200" width="256" height="52" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="2 2"/>
    <text x="20" y="218" font-size="9.5" font-weight="700" fill="#a5b4fc">ED25519 ASYMMETRIC SIGNATURE</text>
    <text x="20" y="238" font-size="8" font-family="monospace" fill="#c7d2fe">sig: 1c80b5e2...90ef34a1 (Verified)</text>
  </g>

  <!-- Footer Verification Note -->
  <text x="550" y="398" text-anchor="middle" font-size="11.5" fill="#a5b4fc">🔒 Verified in production across 282+ consecutive builds by <tspan font-family="monospace" fill="#38bdf8">verify-attest.go</tspan> • Zero broken links</text>
</svg>
