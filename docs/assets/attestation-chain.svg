    <rect width="280" height="270" rx="12" fill="url(#blockGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect width="280" height="38" rx="12" fill="#312e81"/>
    <rect y="26" width="280" height="12" fill="#312e81"/>
    <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">ATTESTATION RECORD N+1</text>

    <text x="16" y="58" font-size="10" font-weight="700" fill="#94a3b8">TIMESTAMP:</text>
    <text x="95" y="58" font-size="10" font-family="monospace" fill="#e0e7ff">1791301840</text>

    <text x="16" y="78" font-size="10" font-weight="700" fill="#94a3b8">VERDICT:</text>
    <text x="95" y="78" font-size="10" font-weight="700" fill="#34d399">ALLOW (HTTP 200)</text>

