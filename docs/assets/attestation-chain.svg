  <rect x="338" y="200" width="56" height="20" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="366" y="213" text-anchor="middle" font-size="8.5" font-weight="700" fill="#818cf8">LINK</text>

